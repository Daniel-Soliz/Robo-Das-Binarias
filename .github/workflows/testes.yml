name: DS Trader - testes, instalador e Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ds-trader-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Instalar bibliotecas de leitura local (ambos sistemas)
        run: python -m pip install -r requirements-runtime.txt
      - name: Executar todos os testes do aplicativo
        run: python -m unittest discover -s tests_ds -v
  windows:
    needs: core
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Compilar aplicativo, instalador e testar o fluxo real
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DS-Trader-Windows-x64
          path: |
            release-build/DS-Trader-Setup.exe
            DS-Trader-Setup.sha256.txt
            DS-Trader-Windows-x64.zip
            DS-Trader-Windows-x64.sha256.txt
            release-build/smoke-result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostico-windows
          path: |
            smoke-error.txt
            build-error.txt
            smoke-result.json
  publicar:
    # Permite a publicacao tanto no push como na execucao manual da branch main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Obter script de conferencia
        uses: actions/checkout@v4
      - name: Obter executavel compilado e testado no Windows
        uses: actions/download-artifact@v4
        with:
          name: DS-Trader-Windows-x64
          path: downloads
      - name: Conferir relatorio Windows, arquivos e integridade SHA256
        shell: bash
        run: |
          set -euo pipefail
          echo 'Arquivos recebidos do Windows:'
          find downloads -maxdepth 5 -type f -printf '%p (%s bytes)\n'
          python scripts/prepare_release.py downloads release-ready
      - name: Publicar arquivos EXE e ZIP no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::GITHUB_TOKEN nao disponivel"; exit 1; }
          gh --version
          echo "Repositorio: $GH_REPO"
          tag="v1.3.0-build-${GITHUB_SHA:0:8}"
          files=(
            release-ready/DS-Trader-Setup.exe
            release-ready/DS-Trader-Setup.sha256.txt
            release-ready/DS-Trader-Windows-x64.zip
            release-ready/DS-Trader-Windows-x64.sha256.txt
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "DS Trader 1.2.0 - Windows x64" \
              --latest \
              --notes "Instalador Windows com assistente, atalho na Area de Trabalho e desinstalador. Inclui monitoramento visual local e simulacao de dados historicos. Nao envia ordens; nao e conectado a IQ Option. Sem assinatura digital: nao desative protecoes do Windows."
          fi
          gh release view "$tag" --json url,assets --jq '.url, (.assets[].name)'
      - name: Diagnostico de falha na publicacao
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "::error::Publicacao falhou. Confira o primeiro passo vermelho no job publicar."
          echo "O instalador passou no Windows, mas ainda nao deve ser mostrado como download sem a release."
          find downloads -maxdepth 5 -type f 2>/dev/null || true
