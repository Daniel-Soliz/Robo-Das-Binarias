name: DS Trader - testes, instalador e Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ds-trader-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - run: python -m unittest discover -s tests_ds -v
  legacy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - run: python -m pip install -r requirements-legacy.txt
      - run: python -m pytest tests -q
        env:
          QT_QPA_PLATFORM: offscreen
  windows:
    needs: core
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Compilar aplicativo, instalador e testar o fluxo real
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DS-Trader-Windows-x64
          path: |
            release-build/DS-Trader-Setup.exe
            DS-Trader-Setup.sha256.txt
            DS-Trader-Windows-x64.zip
            DS-Trader-Windows-x64.sha256.txt
            release-build/smoke-result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostico-windows
          path: smoke-error.txt
  publicar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DS-Trader-Windows-x64
          path: downloads
      - name: Conferir integridade dos arquivos
        shell: bash
        run: |
          set -euo pipefail
          cd downloads
          test -s release-build/smoke-result.json
          cp release-build/DS-Trader-Setup.exe ./DS-Trader-Setup.exe
          sha256sum -c DS-Trader-Setup.sha256.txt
          sha256sum -c DS-Trader-Windows-x64.sha256.txt
      - name: Publicar instalador verificado em GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd downloads
          arquivos=(DS-Trader-Setup.exe DS-Trader-Setup.sha256.txt DS-Trader-Windows-x64.zip DS-Trader-Windows-x64.sha256.txt)
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "${arquivos[@]}" --clobber
          else
            gh release create v1.0.0 "${arquivos[@]}" --target "$GITHUB_SHA" --title 'DS Trader 1.0.0 - Windows x64' --notes 'Instalador Windows com atalho na Área de Trabalho; pacote portátil opcional. Aplicativo local de análise e simulação; não envia ordens. Compilação e smoke test de GUI automatizados em Windows Server 2022. Sem assinatura digital; não desative proteções do Windows.'
          fi
